name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    name: Release tests - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Configure Testbench for Laravel matrix
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Verify framework versions
        run: |
          composer show laravel/framework
          composer show orchestra/testbench
      - name: Run tests
        run: composer test

  publish:
    name: Create GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
