name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / PHP 8.3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Configure Testbench for Laravel matrix
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Verify framework versions
        run: |
          composer show laravel/framework
          composer show orchestra/testbench
      - name: Run tests
        run: composer test
